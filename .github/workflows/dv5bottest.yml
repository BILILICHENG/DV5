name: DV5BotRun123 

on: 
  schedule: 
    - cron: '0 15 * * *' 
  workflow_dispatch:

jobs: 
  run-bot-and-sync: 
    runs-on: ubuntu-latest 

    steps: 
    - name: Clone private repository 
      run: | 
        git clone https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/BILILICHENG/DV5BOT.git private-repo > /dev/null 2>&1 

    - name: Set up Python 
      uses: actions/setup-python@v5 
      with: 
        python-version: '3.10' 

    - name: Install dependencies 
      run: | 
        cd private-repo 
        python -m pip install --upgrade pip > /dev/null 2>&1 
        if [ -f requirements.txt ]; then 
          pip install -r requirements.txt > /dev/null 2>&1 
        fi 

    - name: Run bot script 
      run: | 
        cd private-repo 
        python bot.py > /dev/null 2>&1 

    - name: Run ABU run.py 
      run: | 
        cd private-repo/ABU 
        python run.py > /dev/null 2>&1 

    - name: Run UAI run.py 
      run: | 
        cd private-repo
        python user_all_image.py > /dev/null 2>&1 

    - name: Push changes to private repo 
      run: | 
        cd private-repo 
        git config user.name "github-actions[bot]" 
        git config user.email "github-actions[bot]@users.noreply.github.com" 
        if git status --porcelain | grep . > /dev/null; then 
          git add . > /dev/null 2>&1 
          git commit -m "Auto update from GitHub Actions at $(date)" > /dev/null 2>&1 
          git push origin main > /dev/null 2>&1 
        fi 

    - name: Sync files to public repo 
      run: | 
        git config --global user.name "github-actions[bot]" 
        git config --global user.email "github-actions[bot]@users.noreply.github.com" 
        git clone https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/BILILICHENG/DV5.git public-repo > /dev/null 2>&1 
        
        mkdir -p public-repo/test9 2>&1
        
        cp private-repo/onlinejiami.txt public-repo/test9/onlinejiami.txt 2>&1
        
        if [ -f "private-repo/ABU/ABU.txt" ]; then 
          cp private-repo/ABU/ABU.txt public-repo/test9/ABU.txt 2>&1
        fi 
        
        if [ -f "private-repo/user_all_image.png" ]; then 
          cp private-repo/user_all_image.png public-repo/test9/user_all_image.png 2>&1
        fi 
        
        if [ -f "private-repo/user_all_image_online.txt" ]; then 
          cp private-repo/user_all_image_online.txt public-repo/test9/user_all_image_online.txt 2>&1
        fi 
        
        cd public-repo 
        git add test9/onlinejiami.txt > /dev/null 2>&1 
        
        if [ -f "test9/ABU.txt" ]; then 
          git add test9/ABU.txt > /dev/null 2>&1 
        fi 
        
        if [ -f "test9/user_all_image.png" ]; then 
          git add test9/user_all_image.png > /dev/null 2>&1 
        fi 
        
        if [ -f "test9/user_all_image_online.txt" ]; then 
          git add test9/user_all_image_online.txt > /dev/null 2>&1 
        fi 
        
        if git diff --staged --quiet > /dev/null 2>&1; then 
          : 
        else 
          git commit -m "Update files at $(date)" > /dev/null 2>&1 
          git push origin main > /dev/null 2>&1 
        fi 

    - name: Clean up 
      run: | 
        rm -rf private-repo public-repo > /dev/null 2>&1
