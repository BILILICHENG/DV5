name: DV5BotRun123 

on: 
  schedule: 
    - cron: '0 15 * * *' 
  workflow_dispatch:

jobs: 
  run-bot-and-sync: 
    runs-on: ubuntu-latest 

    steps: 
    - name: Clone private repository 
      run: | 
        git clone https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/BILILICHENG/DV5BOT.git private-repo > /dev/null 2>&1 

    - name: Set up Python 
      uses: actions/setup-python@v6 
      with: 
        python-version: '3.10' 

    - name: Install dependencies 
      run: | 
        cd private-repo 
        python -m pip install --upgrade pip > /dev/null 2>&1 
        if [ -f requirements.txt ]; then 
          pip install -r requirements.txt > /dev/null 2>&1 
        fi 

    - name: Run bot script 
      run: | 
        cd private-repo 
        python bot.py > /dev/null 2>&1 

    - name: Run ABU run.py 
      run: | 
        cd private-repo/ABU 
        python run.py > /dev/null 2>&1 

    - name: Run ServerTest.py 
      run: | 
        cd private-repo/DanceVrushLocalServerData 
        python ServerTest.py > /dev/null 2>&1 

    - name: Push changes to private repo 
      run: | 
        cd private-repo 
        git config user.name "github-actions[bot]" 
        git config user.email "github-actions[bot]@users.noreply.github.com" 
        if git status --porcelain | grep . > /dev/null; then 
          git add . > /dev/null 2>&1 
          git commit -m "Auto update from GitHub Actions at $(date)" > /dev/null 2>&1 
          git push origin main > /dev/null 2>&1 
        fi 

    - name: Sync files to public repo 
      run: | 
        git config --global user.name "github-actions[bot]" 
        git config --global user.email "github-actions[bot]@users.noreply.github.com" 
        git clone https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/BILILICHENG/DV5.git public-repo > /dev/null 2>&1 

        mkdir -p public-repo/DanceVrushLocalServerData 

        if [ -f "private-repo/DanceVrushLocalServerData/test9_JM.json" ] && [ -f "private-repo/DanceVrushLocalServerData/test7_JM.json" ]; then 
          cp private-repo/DanceVrushLocalServerData/test9_JM.json public-repo/DanceVrushLocalServerData/test9_JM.json 
          cp private-repo/DanceVrushLocalServerData/test7_JM.json public-repo/DanceVrushLocalServerData/test7_JM.json 
        fi 

        mkdir -p public-repo/test9 
        cp private-repo/onlineindex_jiami.txt public-repo/test9/onlineindex_jiami.txt 
        if [ -f "private-repo/ABU/ABU.txt" ]; then 
          cp private-repo/ABU/ABU.txt public-repo/test9/ABU.txt 
        fi 
        if [ -f "private-repo/user_all_image.png" ]; then 
          cp private-repo/user_all_image.png public-repo/test9/user_all_image.png 
        fi
        
        cd public-repo 

        git add test9/onlineindex_jiami.txt 
        if [ -f "test9/ABU.txt" ]; then 
          git add test9/ABU.txt 
        fi 
        if [ -f "test9/user_all_image.png" ]; then 
          git add test9/user_all_image.png 
        fi 

        for file in DanceVrushLocalServerData/*_JM.json; do
          if [ -f "$file" ]; then
            git add "$file"
          fi
        done
        
        if git diff --staged --quiet > /dev/null 2>&1; then 
          : 
        else 
          git commit -m "Update files at $(date)" > /dev/null 2>&1 
          git push origin main > /dev/null 2>&1 
        fi 

    - name: Clean up 
      run: | 
        rm -rf private-repo public-repo > /dev/null 2>&1
