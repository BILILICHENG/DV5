            color: white;

        function copyDiscordUser(element) {
            const text = 'LI_CHENG#5269';
            const tooltip = element.querySelector('.copy-tooltip');
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = tooltip.textContent;
                tooltip.textContent = '复制成功！';
                element.classList.add('copied');
                setTimeout(() => {
                    tooltip.textContent = originalText;
                    element.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                const originalText = tooltip.textContent;
                tooltip.textContent = '复制失败';
                setTimeout(() => {
                    tooltip.textContent = originalText;
                }, 2000);
            });
        }

        function changeLanguage(lang) {
            const translation = translations[lang];
            if (!translation) return;
            
            document.getElementById('title').textContent = translation.title;
            document.getElementById('greeting').innerHTML = translation.greeting;
            document.getElementById('message1').innerHTML = translation.message1;
            document.getElementById('message2').innerHTML = translation.message2;
            document.getElementById('thanks').textContent = translation.thanks;
            document.getElementById('copyright').textContent = translation.copyright;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            document.documentElement.lang = lang;
        }

        function autoDetectLanguage() {
            const userLang = navigator.language || navigator.userLanguage;
            let detectedLang = 'en';
            
            if (userLang.startsWith('zh-CN')) {
                detectedLang = 'zh-CN';
            } else if (userLang.startsWith('zh-TW') || userLang.startsWith('zh-HK')) {
                detectedLang = 'zh-TW';
            } else if (userLang.startsWith('ja')) {
                detectedLang = 'ja';
            } else if (userLang.startsWith('ko')) {
                detectedLang = 'ko';
            } else if (userLang.startsWith('ru')) {
                detectedLang = 'ru';
            }
            
            changeLanguage(detectedLang);
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector('.auto-detect').classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            autoDetectLanguage();
        });
